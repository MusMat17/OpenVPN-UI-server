name: Build and test OpenVPN Control
on:
  push:
    branches: ["feature/**", "main"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test
        run: go test ./... && go vet ./...
      - name: Validate installer
        run: bash -n install.sh && bash -n build.sh
      - name: Build static AMD64 binary
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: openvpn-control-linux-amd64
          path: bin/openvpn-control-linux-amd64
