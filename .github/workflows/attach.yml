name: Build Attach Mode
on:
  push:
    branches: [feature/attach-existing-openvpn]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attach:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: |
          go test ./...
          go vet ./...
          bash -n attach-ui.sh
          python3 -m unittest discover -s tests
          bash build.sh
          sha256sum bin/openvpn-control-linux-amd64 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: attach-linux-amd64
          path: |
            bin/openvpn-control-linux-amd64
            SHA256SUMS
            attach-ui.sh
            ATTACH.md
